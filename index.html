<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#a0bdb5"><title>Office 小技辞典 | Bloom Wamii</title><style>
:root{--ink:#334a4b;--muted:#738489;--sage:#8eae9e;--blue:#8eaec0;--ivory:#bda98c;--paper:#f8faf8;--line:#e1e9e6}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:-apple-system,BlinkMacSystemFont,'Yu Gothic','Hiragino Kaku Gothic ProN',Meiryo,sans-serif;color:var(--ink);line-height:1.7}button,input{font:inherit}button{cursor:pointer}header{background:linear-gradient(115deg,#a9c5b7,#a9c4d4);padding:36px 20px 32px}header .wrap{max-width:1020px;margin:auto}header .eyebrow{font-size:12px;letter-spacing:.14em;color:#315a61;font-weight:700}h1{font-size:clamp(25px,5vw,39px);margin:7px 0 5px;letter-spacing:.035em}header p{margin:0;font-size:14px}main{max-width:1020px;margin:auto;padding:22px 18px 70px}.search{display:flex;align-items:center;background:white;border:1px solid var(--line);border-radius:13px;padding:0 15px;box-shadow:0 4px 18px #3e686008;margin-bottom:17px}.search span{font-size:22px;color:#70898c}.search input{width:100%;border:0;outline:0;padding:17px 12px;background:transparent;font-size:16px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:15px 0 20px}.tab{background:white;border:1px solid var(--line);border-radius:13px;padding:12px 5px;color:#526b6c;font-weight:700}.tab.active{border:2px solid #607d77;background:#edf5f1}.tab[data-tab=excel].active{background:#e6f1e9}.tab[data-tab=word].active{background:#e6eff6}.tab[data-tab=powerpoint].active{background:#f6f0e5}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.toolbar small{color:var(--muted)}.toolbar button,.actions button{border:1px solid var(--line);border-radius:9px;background:white;padding:7px 12px;color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:0 3px 12px #315b5008;display:flex;flex-direction:column;gap:8px}.card-head{display:flex;justify-content:space-between;align-items:center}.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}.excel{background:#e6f1e9;color:#446a55}.word{background:#e6eff6;color:#476c80}.powerpoint{background:#f5eddf;color:#80684d}.fav{border:0;background:none;font-size:23px;color:#a0aaa8;padding:0 5px}.fav.on{color:#b38e52}.card h2{font-size:17px;margin:0;line-height:1.5}.card p{font-size:13px;color:#657b7d;margin:0;flex:1}.detailbtn{border:0;background:#edf4f1;color:#3f6760;border-radius:9px;padding:9px 12px;text-align:left;font-weight:700}.detail{margin-top:12px;padding-top:13px;border-top:1px solid var(--line)}.detail h3{font-size:13px;margin:0 0 8px}.detail ol{padding-left:23px;margin:0 0 12px;font-size:13px}.detail li{padding:4px 0}.note{background:#f7f8f5;border-radius:9px;padding:10px;font-size:12px;color:#617071}.actions{display:flex;gap:8px;margin-top:12px}.empty{text-align:center;padding:60px 10px;color:#7a8d8b}.footer{text-align:center;color:#8b9a98;font-size:12px;margin-top:45px}.diagram{margin:10px 0;border:1px solid #e2eae7;border-radius:10px;padding:13px;background:#fbfcfb}.diagram .shapes{display:flex;justify-content:space-between;gap:10px;margin:8px 0}.diagram .shape{flex:1;height:35px;border-radius:6px;background:#d9e8e2;border:1px solid #8eae9e}.diagram .caption{font-size:11px;color:#6e8380;text-align:center}.tip{font-size:12px;color:#758885}.notice{font-size:12px;color:#718582;margin:0 0 17px}@media(max-width:650px){.grid{grid-template-columns:1fr}.tabs{gap:5px}.tab{font-size:12px;padding:12px 2px}header{padding:28px 18px}.toolbar{align-items:flex-start}}@media print{header{background:white!important;padding:10px 0}.search,.tabs,.toolbar,.fav,.detailbtn,.actions,.footer,.notice{display:none!important}main{padding:0}.grid{display:block}.card{break-inside:avoid;box-shadow:none;margin:0 0 15px;border:1px solid #bbb}.detail{display:block!important}.card h2{font-size:14px}body{background:white;font-size:11px}@page{size:A4;margin:15mm}}
</style></head><body><header><div class="wrap"><div class="eyebrow">BLOOM WAMII · OFFICE TIPS</div><h1>Office 小技辞典</h1><p>ちょっと便利な操作を、すぐに見つける。</p></div></header><main><div class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="例：図形を揃える、行間、貼り付け" aria-label="小技を検索"></div><div class="tabs" role="group" aria-label="アプリ別フィルター"><button class="tab active" data-tab="all">すべて</button><button class="tab" data-tab="excel">Excel</button><button class="tab" data-tab="word">Word</button><button class="tab" data-tab="powerpoint">PowerPoint</button></div><div class="toolbar"><small id="count"></small><div><button id="favs">☆ お気に入りのみ</button> <button id="print">印刷</button></div></div><p class="notice">試作品：代表的な小技12件を収録。137項目の全件版ではありません。操作はWindows版Microsoft 365を想定しています。</p><div id="results" class="grid"></div><div class="footer">Office 小技辞典 · Bloom Wamii / Prototype v0.1</div></main><script>
const tips=[
{id:'e01',app:'excel',title:'値のみ貼り付け',desc:'計算式を除いて、表示されている値だけを貼り付ける。',keywords:'コピー ペースト 形式を選択して貼り付け',steps:['コピーしたいセルを選択し、Ctrl + C を押す。','貼り付け先のセルを選択する。','Ctrl + Alt + V で「形式を選択して貼り付け」を開く。','「値」を選んで確定する。'],note:'貼り付け先の書式は状況に応じて残ります。'},
{id:'e02',app:'excel',title:'列幅を自動調整',desc:'文字の長さに合わせて列幅を一度に整える。',keywords:'表 整列 サイズ 幅',steps:['幅を調整したい列を選択する。','列見出しの右側の境界線をダブルクリックする。'],note:'複数列を選択してまとめて調整できます。'},
{id:'e03',app:'excel',title:'可視セルのみコピー',desc:'非表示の行や列を除いて、見えているセルをコピーする。',keywords:'フィルター 選択 非表示',steps:['コピーする範囲を選択する。','Alt + ; で可視セルのみを選択する。','Ctrl + C でコピーし、貼り付ける。'],note:'非表示行を含む複雑な範囲では貼り付け結果を確認してください。'},
{id:'e04',app:'excel',title:'図形を均等に配置',desc:'複数の図形の間隔をきれいに揃える。',keywords:'図形 整列 配列 間隔 左右 上下',steps:['Ctrlキーを押しながら3個以上の図形を選択する。','「図形の書式」タブで「配置」を開く。','「左右に整列」または「上下に整列」を選ぶ。'],note:'図形を揃える基準（選択したオブジェクト／シートなど）も確認してください。',diagram:true},
{id:'e05',app:'excel',title:'フラッシュフィル',desc:'入力例から規則を読み取り、残りのデータを補完する。',keywords:'自動入力 分割 抽出 Ctrl E',steps:['元データの隣の列に、欲しい結果を1件入力する。','次のセルを選択し、Ctrl + E を押す。','補完結果を確認する。'],note:'複雑なパターンでは誤認識することがあります。'},
{id:'w01',app:'word',title:'フォント変更後の行間を調整',desc:'フォントを変えた後に広がった行間を整える。',keywords:'段落 グリッド 固定値 余白 行間',steps:['対象の段落を選択する。','「ホーム」→「段落」ダイアログを開く。','「インデントと行間隔」で行間や段落前後を調整する。','必要に応じて「1ページの行数を指定時に文字を行グリッド線に合わせる」をオフにする。'],note:'固定値が小さすぎると文字が欠けることがあります。'},
{id:'w02',app:'word',title:'自動目次を作る',desc:'見出しスタイルから目次を自動生成する。',keywords:'報告書 見出し 章 参考資料',steps:['章タイトルに「見出し1」などのスタイルを設定する。','目次を置く位置にカーソルを移動する。','「参考資料」→「目次」から自動作成の目次を選ぶ。'],note:'本文を変更したら目次を右クリックして更新します。'},
{id:'w03',app:'word',title:'一部のページだけ横向きにする',desc:'縦向きの報告書に横長の表を入れる。',keywords:'セクション ページ レイアウト 用紙',steps:['横向きにしたい範囲を選択する。','「レイアウト」→「ページ設定」ダイアログを開く。','印刷の向きを「横」にし、適用先を「選択している文字列」に設定する。'],note:'Wordが必要なセクション区切りを挿入する場合があります。'},
{id:'w04',app:'word',title:'表の見出し行を繰り返す',desc:'複数ページにまたがる表の各ページに見出しを表示する。',keywords:'表 報告書 印刷 タイトル',steps:['表の先頭にある見出し行を選択する。','「テーブル レイアウト」→「タイトル行の繰り返し」を選ぶ。'],note:'印刷レイアウトで確認してください。'},
{id:'p01',app:'powerpoint',title:'図形を左右に均等配置',desc:'複数の図形を同じ間隔で横に並べる。',keywords:'整列 配置 図形 配列',steps:['3個以上の図形を選択する。','「図形の書式」→「配置」を開く。','「左右に整列」を選択する。'],note:'配置基準を確認すると意図した位置に揃えやすくなります。',diagram:true},
{id:'p02',app:'powerpoint',title:'図形のサイズを揃える',desc:'複数のボックスを同じ大きさにする。',keywords:'幅 高さ 配置 整列',steps:['サイズを揃えたい図形を複数選択する。','「図形の書式」のサイズ欄で高さと幅を指定する。'],note:'図形によっては縦横比の固定設定を確認してください。'},
{id:'p03',app:'powerpoint',title:'図形に文字を入力して中央揃え',desc:'図形の中に文字を入れ、上下左右の中央に配置する。',keywords:'テキスト ボックス 文字揃え',steps:['図形を選択して文字を入力する。','「ホーム」で文字を中央揃えにする。','「図形の書式」→「文字の配置」で上下中央にする。'],note:'図形の書式設定から内部余白も調整できます。'}
];
const $=s=>document.querySelector(s);let tab='all',onlyFav=false;let favs;try{favs=new Set(JSON.parse(localStorage.getItem('officeTipsFavorites')||'[]'))}catch{favs=new Set()};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const q=$('#search').value.trim().toLocaleLowerCase();const matches=tips.filter(t=>(tab==='all'||t.app===tab)&&(!onlyFav||favs.has(t.id))&&[t.title,t.desc,t.keywords,t.app].join(' ').toLocaleLowerCase().includes(q));$('#count').textContent=`${matches.length} 件の小技を表示`;$('#favs').textContent=onlyFav?'★ お気に入りを表示中':'☆ お気に入りのみ';$('#results').innerHTML=matches.length?matches.map(t=>`<article class="card"><div class="card-head"><span class="pill ${t.app}">${t.app==='excel'?'Excel':t.app==='word'?'Word':'PowerPoint'}</span><button class="fav ${favs.has(t.id)?'on':''}" data-fav="${t.id}" aria-label="お気に入りを切り替え">${favs.has(t.id)?'★':'☆'}</button></div><h2>${esc(t.title)}</h2><p>${esc(t.desc)}</p><button class="detailbtn" data-open="${t.id}" aria-expanded="false">操作手順を見る ＋</button><div class="detail" id="detail-${t.id}" hidden><h3>操作手順</h3><ol>${t.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>${t.diagram?'<div class="diagram"><div class="caption">均等配置のイメージ</div><div class="shapes"><div class="shape"></div><div class="shape"></div><div class="shape"></div></div><div class="caption">図形の間隔を揃える</div></div>':''}<div class="note">ポイント：${esc(t.note)}</div><div class="actions"><button data-copy="${t.id}">手順をコピー</button><button onclick="window.print()">印刷する</button></div></div></article>`).join(''):'<div class="empty">該当する小技がありません。<br>別の言葉で検索してみてください。</div>'}
$('#results').addEventListener('click',async e=>{const f=e.target.closest('[data-fav]');if(f){const id=f.dataset.fav;favs.has(id)?favs.delete(id):favs.add(id);try{localStorage.setItem('officeTipsFavorites',JSON.stringify([...favs]))}catch{}render();return}const o=e.target.closest('[data-open]');if(o){const d=$('#detail-'+o.dataset.open);d.hidden=!d.hidden;o.setAttribute('aria-expanded',String(!d.hidden));o.textContent=d.hidden?'操作手順を見る ＋':'操作手順を閉じる −';return}const c=e.target.closest('[data-copy]');if(c){const t=tips.find(x=>x.id===c.dataset.copy);const v=t.title+'\n'+t.steps.map((s,i)=>`${i+1}. ${s}`).join('\n');try{await navigator.clipboard.writeText(v);c.textContent='コピーしました'}catch{c.textContent='コピーできませんでした'}return}});document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()}));$('#search').addEventListener('input',render);$('#favs').addEventListener('click',()=>{onlyFav=!onlyFav;render()});$('#print').addEventListener('click',()=>{document.querySelectorAll('.detail').forEach(x=>x.hidden=false);window.print()});render();
</script></body></html>
