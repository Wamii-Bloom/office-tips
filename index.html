const $=s=>document.querySelector(s);let app='all',cat='すべて',favOnly=false;let favs=new Set();try{favs=new Set(JSON.parse(localStorage.getItem('officeTipsFavV02')||'[]'))}catch(e){};
function el(tag,className,text){let e=document.createElement(tag);if(className)e.className=className;if(text!==undefined)e.textContent=text;return e}
function setQuery(q){const alternatives={'図形を揃えたい':'図形','行間を直したい':'行間','値だけ貼りたい':'値','一部を横向きにしたい':'横向き','目次を作りたい':'目次'};$('#q').value=alternatives[q]||q;app='all';cat='すべて';favOnly=false;render();$('#q').focus()}
function render(){

$('#categories').replaceChildren(...categories.map(c=>{let b=el('button','category'+(cat===c?' active':''),c);b.onclick=()=>{cat=c;render()};return b}));
